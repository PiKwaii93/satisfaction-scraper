name: Schedule heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record scheduled execution
        run: |
          echo "Scheduled heartbeat"
          date -u
          echo "SHA=$GITHUB_SHA"
          echo "REF=$GITHUB_REF"
